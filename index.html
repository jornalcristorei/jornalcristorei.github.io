<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornal Cristo Rei — Edições</title>
<style>

  :root{
    --marrom-vinho: #7a2e20;
    --verde-mato: #3c4f38;
    --dourado: #a9812f;
    --dourado-claro: #cdae66;
    --creme: #f7f1e2;
    --creme-escuro: #efe3c4;
    --tinta: #211d16;
    --cinza-nota: #6b6355;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family: "Georgia", "Times New Roman", serif;
    background: var(--creme);
    color: var(--tinta);
  }

  header{
    background: var(--tinta);
    color: var(--creme);
    padding: 10px 24px;
    font-weight:bold;
    letter-spacing:2px;
    font-size:13px;
    text-transform:uppercase;
  }

  .hero{
    text-align:center;
    padding: 50px 20px 40px 20px;
    border-bottom: 2px solid var(--dourado);
  }
  .hero .linha-topo{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--verde-mato);
    margin-bottom:16px;
  }
  .hero img.brasao{ width:90px; margin-bottom:18px; }
  .hero .de{
    font-size:13px;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--marrom-vinho);
  }
  .hero h1{ font-size:44px; letter-spacing:1px; margin:4px 0 10px 0; }
  .hero .sub{ font-style:italic; color:var(--verde-mato); font-size:15px; }

  .edicoes{
    max-width:760px;
    margin:0 auto;
    padding:50px 20px 80px 20px;
  }
  .edicoes h2{
    text-align:center;
    font-size:13px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--marrom-vinho);
    margin-bottom:34px;
  }

  .cartao-edicao{
    display:flex;
    align-items:center;
    gap:22px;
    background:#fff;
    border:1px solid #e2d8bd;
    box-shadow: 0 3px 10px rgba(33,29,22,0.07);
    padding:18px;
    margin-bottom:20px;
    text-decoration:none;
    color:var(--tinta);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cartao-edicao:hover{
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(33,29,22,0.14);
  }
  .cartao-edicao img{
    width:78px;
    flex-shrink:0;
    border:1px solid #e2d8bd;
  }
  .cartao-edicao .info{ flex:1; }
  .cartao-edicao .numero{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--dourado);
    font-weight:bold;
    margin-bottom:4px;
  }
  .cartao-edicao .titulo{
    font-size:19px;
    font-weight:bold;
    margin-bottom:3px;
  }
  .cartao-edicao .data{
    font-size:12.5px;
    color:var(--cinza-nota);
    font-style:italic;
  }
  .cartao-edicao .abrir{
    flex-shrink:0;
    font-size:11.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    font-weight:bold;
    color:var(--marrom-vinho);
    border:1.3px solid var(--marrom-vinho);
    padding:8px 14px;
    border-radius:2px;
  }
  .cartao-edicao:hover .abrir{
    background:var(--marrom-vinho);
    color:var(--creme);
  }

  footer{
    background: var(--tinta);
    color: var(--creme-escuro);
    text-align:center;
    padding: 28px 20px;
    font-size:12.5px;
    letter-spacing:.4px;
  }
  footer .nome{
    font-weight:bold;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:6px;
    color:var(--creme);
  }

  @media (max-width:480px){
    .hero h1{ font-size:32px; }
    .cartao-edicao{ flex-direction:column; text-align:center; }
    .cartao-edicao img{ width:100px; }
  }
</style>
</head>
<body>

<header>Jornal Cristo Rei — Portal de Edições</header>

<section class="hero">
  <img class="brasao" src="assets/brasao.svg" alt="Brasão do Centro de Estudos Ave Maria">
  <div class="de">Jornal</div>
  <h1>CRISTO REI</h1>
  <div class="sub">Informativo do Centro de Estudos Ave Maria</div>
</section>

<section class="edicoes">
  <h2>Edições</h2>

  <!-- Cada edição é um cartão. Para adicionar uma nova, duplique o bloco <a class="cartao-edicao">
       colocando o novo arquivo em /edicoes/ e atualizando href, imagem, número e data. -->

  <a class="cartao-edicao" href="edicoes/edicao-01.html">
    <img src="assets/capa-edicao-01.png" alt="Capa da edição 1">
    <div class="info">
      <div class="numero">Edição nº 00 — Ano I</div>
      <div class="titulo">Entre a corda e o banquinho</div>
      <div class="data">Mês de 2026</div>
    </div>
    <div class="abrir">Abrir edição</div>
  </a>

</section>

<footer>
  <div class="nome">Centro de Estudos Ave Maria</div>
  <div>Paróquia Nossa Senhora da Conceição Aparecida — Alegrete/RS</div>
</footer>

</body>
</html>
